<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Banca 360 — Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../styles/main.css"/>
  <link rel="stylesheet" href="../styles/dashboard.css"/>
</head>
<body>

  <div class="app-shell">

    <!-- ============ SIDEBAR ============ -->
    <aside class="sidebar">
      <div class="sidebar-logo">Banca<span>360</span></div>

      <nav class="sidebar-nav">
        <a href="dashboard.html" class="sidebar-link active">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <rect x="3" y="3" width="7" height="7"/>
            <rect x="14" y="3" width="7" height="7"/>
            <rect x="14" y="14" width="7" height="7"/>
            <rect x="3" y="14" width="7" height="7"/>
          </svg>
          Dashboard
        </a>
        <a href="transfer.html" class="sidebar-link">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <line x1="17" y1="3" x2="21" y2="7"/>
            <polyline points="21 7 21 11 17 11"/>
            <line x1="7" y1="21" x2="3" y2="17"/>
            <polyline points="3 17 3 13 7 13"/>
            <line x1="3" y1="17" x2="21" y2="7"/>
          </svg>
          Transferencias
        </a>
        <a href="mobile-payment.html" class="sidebar-link">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <rect x="5" y="2" width="14" height="20" rx="2"/>
            <line x1="12" y1="18" x2="12.01" y2="18"/>
          </svg>
          Pago Móvil
        </a>
        <a href="deposit.html" class="sidebar-link">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <line x1="12" y1="5" x2="12" y2="19"/>
            <line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
          Depósitos
        </a>
        <a href="history.html" class="sidebar-link">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <line x1="8" y1="6" x2="21" y2="6"/>
            <line x1="8" y1="12" x2="21" y2="12"/>
            <line x1="8" y1="18" x2="21" y2="18"/>
            <circle cx="4" cy="6" r="1"/>
            <circle cx="4" cy="12" r="1"/>
            <circle cx="4" cy="18" r="1"/>
          </svg>
          Historial
        </a>
        <a href="profile.html" class="sidebar-link">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
          Perfil
        </a>
      </nav>

      <div class="sidebar-footer">
        <a href="#" class="sidebar-link" onclick="AuthGuard.logout(); return false;">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
          Cerrar sesión
        </a>
      </div>
    </aside>

    <!-- ============ MAIN ============ -->
    <main class="app-main">

      <!-- TOPBAR -->
      <header class="topbar">
        <div class="topbar-greeting">
          Hola, <strong id="greetingName">—</strong>
        </div>
        <div class="topbar-actions">
          <button class="theme-toggle" onclick="Theme.toggle()">
            <svg id="iconSun" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" width="14" height="14">
              <circle cx="12" cy="12" r="4"/>
              <path d="M12 2v2M12 20v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M2 12h2M20 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
            </svg>
            <svg id="iconMoon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" width="14" height="14" style="display:none">
              <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>
            </svg>
            <span id="themeLabel">CLARO</span>
          </button>
        </div>
      </header>

      <!-- CONTENT -->
      <section class="content">
        <h1 class="page-title">Resumen de cuenta</h1>

        <!-- TARJETA DE SALDO -->
        <div class="balance-card">
          <div class="balance-label">Saldo disponible</div>
          <div class="balance-row">
            <div class="balance-amount" id="balanceAmount">$0.00</div>
            <button class="balance-toggle" onclick="toggleBalance()" title="Mostrar/ocultar saldo">
              <svg id="balanceEyeOpen" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" width="18" height="18">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <svg id="balanceEyeClosed" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" width="18" height="18" style="display:none">
                <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- ACCESOS RÁPIDOS -->
        <div class="quick-actions">
          <a href="transfer.html" class="quick-action">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" width="22" height="22">
              <line x1="17" y1="3" x2="21" y2="7"/>
              <polyline points="21 7 21 11 17 11"/>
              <line x1="7" y1="21" x2="3" y2="17"/>
              <polyline points="3 17 3 13 7 13"/>
              <line x1="3" y1="17" x2="21" y2="7"/>
            </svg>
            Transferir
          </a>
          <a href="mobile-payment.html" class="quick-action">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" width="22" height="22">
              <rect x="5" y="2" width="14" height="20" rx="2"/>
              <line x1="12" y1="18" x2="12.01" y2="18"/>
            </svg>
            Pago Móvil
          </a>
          <a href="deposit.html" class="quick-action">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" width="22" height="22">
              <line x1="12" y1="5" x2="12" y2="19"/>
              <line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
            Depositar
          </a>
        </div>

        <!-- ÚLTIMAS 3 TRANSACCIONES -->
        <div class="section-header">
          <h2 class="section-title">Últimas transacciones</h2>
          <a href="history.html" class="link-text">Ver todas →</a>
        </div>
        <div class="tx-list" id="txList">
          <!-- Se inserta desde dashboard.js -->
        </div>

      </section>
    </main>

  </div>

  <!-- Scripts (orden importa) -->
  <script src="../js/storage.js"></script>
  <script src="../js/theme.js"></script>
  <script src="../js/auth-guard.js"></script>
  <script src="../js/dashboard.js"></script>
  <script>
    // 1. Verificar sesión activa. Si no, redirige al login.
    const currentUser = AuthGuard.protect();

    // 2. Si hay usuario, inicializar tema y dashboard.
    if (currentUser) {
      Theme.init();
      Dashboard.init(currentUser);
    }
  </script>
</body>
</html>
